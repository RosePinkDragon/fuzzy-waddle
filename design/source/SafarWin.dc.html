<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safar milestone win screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#0F1E3D}
a{color:#F5A524}a:hover{color:#FFC45E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: #0F1E3D; color: #F4F1E8; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2F4A80; background: #1A2C55; color: #F4F1E8; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #F5A524">SAFAR</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Medium · 35 hits</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F5A524; color: #0F1E3D; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>200 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 80px; max-height: 200px; border-radius: 14px; overflow: hidden; background: #18305E; border: 1px solid #2F4A80">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="A passenger waves happily from the window seat of a moving train">
<circle cx="306" cy="40" r="20" fill="#F5A524"></circle>
<path d="M0 112 Q50 76 110 100 T230 92 T366 100 V200 H0 Z" fill="#2E6B4A"></path>
<path d="M0 124 Q70 104 150 120 T366 116 V200 H0 Z" fill="#245A3D"></path>
<rect x="0" y="134" width="366" height="6" fill="#5C6B80"></rect>
<rect x="16" y="64" width="334" height="62" rx="8" fill="#2E5AAC"></rect>
<rect x="16" y="64" width="334" height="9" rx="4" fill="#9AA8BF"></rect>
<g fill="#CFE0FF">
<rect x="34" y="82" width="34" height="22" rx="3"></rect>
<rect x="84" y="82" width="34" height="22" rx="3"></rect>
<rect x="184" y="82" width="34" height="22" rx="3"></rect>
<rect x="234" y="82" width="34" height="22" rx="3"></rect>
<rect x="284" y="82" width="34" height="22" rx="3"></rect>
</g>
<rect x="134" y="82" width="34" height="22" rx="3" fill="#0F1E3D"></rect>
<circle cx="151" cy="94" r="7" fill="#F4F1E8"></circle>
<path d="M148 96 q3 2.5 6 0" fill="none" stroke="#0F1E3D" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M162 98 L176 84 L180 70" fill="none" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="180" cy="68" r="3.5" fill="#F4F1E8"></circle>
<path d="M16 114 H350" stroke="#F5D33A" stroke-width="3"></path>
<g fill="#111111">
<circle cx="54" cy="128" r="8"></circle>
<circle cx="84" cy="128" r="8"></circle>
<circle cx="282" cy="128" r="8"></circle>
<circle cx="312" cy="128" r="8"></circle>
</g>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F5A524" transform="translate(66 34)"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F5A524" transform="translate(206 30) scale(0.7)"></path>
</svg>
<h1 style="position: absolute; bottom: 8px; left: 50%; margin: 0; transform: translateX(-50%) rotate(-6deg); white-space: nowrap; font-family: 'Yatra One', serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #F5A524; background: #0F1E3D; border: 4px double #F5A524; border-radius: 8px; padding: 2px 14px">Pahunch Gaye!</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; gap: 18px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="2">
<div style="display: flex; gap: 5px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="5">
<span style="width: 34px; height: 42px; border-radius: 8px; background: #F4F1E8; color: #0F1E3D; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 22px">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 13px; color: #CFE0FF">Mumbai · Monument</span>
</div>

<div style="border-radius: 14px; background: #1A2C55; border: 1px solid #2F4A80; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #F5A524">BOSS ROUND CLEARED</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.2">200 Crore Club mein entry!</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; background: #FCE3B0; color: #5A3300; border-radius: 10px; padding: 2px 10px">Lives refilled: 7 of 7</span>
<span style="font-size: 12px; font-weight: 700; background: #FCE3B0; color: #5A3300; border-radius: 10px; padding: 2px 10px">+1 Window Seat</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
<span>Next: <span style="color: #F5A524">500 Crore Club</span></span>
<span>20 hits to go</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="20">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #2F4A80; background: #1A2C55"></span>
</sc-for>
</div>
</div>

<div style="position: relative; border-radius: 12px; background: #F4F1E8; color: #0F1E3D; padding: 10px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="position: absolute; left: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #0F1E3D"></span>
<span style="position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #0F1E3D"></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #8A4B00">TICKET · SHARE CARD</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 18px; line-height: 1.25">Ek bhi train miss nahi hui. Tu bata?</p>
<div style="border-top: 2px dashed #C9B98A; padding-top: 5px; font-size: 12px; font-weight: 600; color: #2F4A80">[Game name] · Safar · Medium</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 26px; border: 0; background: #F5A524; color: #0F1E3D; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Share challenge
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #F5A524; background: transparent; color: #F5A524; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Keep playing</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) { return { ch: ch }; }) };
    };
    var segs = [];
    for (var n = 0; n < 20; n++) { segs.push({ n: n }); }
    return { segs: segs, lines: [{ words: [toWord('GATEWAY')] }, { words: [toWord('OF'), toWord('INDIA')] }] };
  }
}
</script>
</body>
</html>
