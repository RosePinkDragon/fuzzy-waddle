<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tyohar milestone win screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#2A0E3A}
a{color:#FF9F1C}a:hover{color:#FFC93C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: #2A0E3A; color: #FFF4E6; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6A2C8C; background: #3B1652; color: #FFF4E6; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #FF9F1C">TYOHAR</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Easy · 20 hits</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #FF9F1C; color: #2A0E3A; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 80px; max-height: 200px; border-radius: 14px; overflow: hidden; background: #2A0E3A; border: 1px solid #4A1D63">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="Every diya is lit around the rangoli and fireworks burst in the sky">
<rect x="0" y="124" width="366" height="76" fill="#3B1652"></rect>
<g stroke-width="2.5" stroke-linecap="round">
<path d="M70 26v-10M70 54v10M56 40h-10M84 40h10M60 30l-7-7M80 30l7-7M60 50l-7 7M80 50l7 7" stroke="#FF9F1C"></path>
<path d="M183 20v-8M183 44v8M171 32h-8M195 32h8M174.5 23.5l-5.5-5.5M191.5 23.5l5.5-5.5M174.5 40.5l-5.5 5.5M191.5 40.5l5.5 5.5" stroke="#F25C9A"></path>
<path d="M296 34v-10M296 62v10M282 48h-10M310 48h10M286 38l-7-7M306 38l7-7M286 58l-7 7M306 58l7 7" stroke="#3FBFC9"></path>
</g>
<circle cx="70" cy="40" r="3" fill="#FFC93C"></circle>
<circle cx="183" cy="32" r="3" fill="#FFC93C"></circle>
<circle cx="296" cy="48" r="3" fill="#FFC93C"></circle>
<ellipse cx="183" cy="170" rx="90" ry="24" fill="#F25C9A"></ellipse>
<ellipse cx="183" cy="170" rx="66" ry="17" fill="#FF9F1C"></ellipse>
<ellipse cx="183" cy="170" rx="42" ry="11" fill="#3FBFC9"></ellipse>
<ellipse cx="183" cy="170" rx="18" ry="5" fill="#FFF4E6"></ellipse>
<g transform="translate(63 128)"><circle cx="0" cy="-12" r="14" fill="#FFC93C" opacity="0.18"></circle><path d="M0 -24 Q7 -12 0 -6 Q-7 -12 0 -24 Z" fill="#FFC93C"></path><path d="M0 -18 Q3 -11 0 -8 Q-3 -11 0 -18 Z" fill="#FF6B1C"></path><path d="M-13 -4 Q0 10 13 -4 Z" fill="#C8641E"></path><path d="M-13 -4 H13" stroke="#E08A3A" stroke-width="2"></path></g>
<g transform="translate(123 124)"><circle cx="0" cy="-12" r="14" fill="#FFC93C" opacity="0.18"></circle><path d="M0 -24 Q7 -12 0 -6 Q-7 -12 0 -24 Z" fill="#FFC93C"></path><path d="M0 -18 Q3 -11 0 -8 Q-3 -11 0 -18 Z" fill="#FF6B1C"></path><path d="M-13 -4 Q0 10 13 -4 Z" fill="#C8641E"></path><path d="M-13 -4 H13" stroke="#E08A3A" stroke-width="2"></path></g>
<g transform="translate(183 122)"><circle cx="0" cy="-12" r="14" fill="#FFC93C" opacity="0.18"></circle><path d="M0 -24 Q7 -12 0 -6 Q-7 -12 0 -24 Z" fill="#FFC93C"></path><path d="M0 -18 Q3 -11 0 -8 Q-3 -11 0 -18 Z" fill="#FF6B1C"></path><path d="M-13 -4 Q0 10 13 -4 Z" fill="#C8641E"></path><path d="M-13 -4 H13" stroke="#E08A3A" stroke-width="2"></path></g>
<g transform="translate(243 124)"><circle cx="0" cy="-12" r="14" fill="#FFC93C" opacity="0.18"></circle><path d="M0 -24 Q7 -12 0 -6 Q-7 -12 0 -24 Z" fill="#FFC93C"></path><path d="M0 -18 Q3 -11 0 -8 Q-3 -11 0 -18 Z" fill="#FF6B1C"></path><path d="M-13 -4 Q0 10 13 -4 Z" fill="#C8641E"></path><path d="M-13 -4 H13" stroke="#E08A3A" stroke-width="2"></path></g>
<g transform="translate(303 128)"><circle cx="0" cy="-12" r="14" fill="#FFC93C" opacity="0.18"></circle><path d="M0 -24 Q7 -12 0 -6 Q-7 -12 0 -24 Z" fill="#FFC93C"></path><path d="M0 -18 Q3 -11 0 -8 Q-3 -11 0 -18 Z" fill="#FF6B1C"></path><path d="M-13 -4 Q0 10 13 -4 Z" fill="#C8641E"></path><path d="M-13 -4 H13" stroke="#E08A3A" stroke-width="2"></path></g>
</svg>
<h1 style="position: absolute; bottom: 8px; left: 50%; margin: 0; transform: translateX(-50%) rotate(-6deg); white-space: nowrap; font-family: 'Yatra One', serif; font-weight: 400; font-size: 30px; line-height: 1.1; color: #FF9F1C; background: #2A0E3A; border: 4px double #FF9F1C; border-radius: 8px; padding: 2px 16px">Badhai Ho!</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; gap: 18px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="1">
<div style="display: flex; gap: 5px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="6">
<span style="width: 34px; height: 42px; border-radius: 8px; background: #FFF4E6; color: #2A0E3A; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 22px">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 13px; color: #F3D6FF">August–September · Modak</span>
</div>

<div style="border-radius: 14px; background: #3B1652; border: 1px solid #6A2C8C; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #FF9F1C">BOSS ROUND CLEARED</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.2">100 Crore Club mein entry!</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; background: #FFE1C2; color: #6A2A00; border-radius: 10px; padding: 2px 10px">Lives refilled: 9 of 9</span>
<span style="font-size: 12px; font-weight: 700; background: #FFE1C2; color: #6A2A00; border-radius: 10px; padding: 2px 10px">+1 Phuljhadi</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
<span>Next: <span style="color: #FF9F1C">200 Crore Club</span></span>
<span>15 hits to go</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="15">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #6A2C8C; background: #3B1652"></span>
</sc-for>
</div>
</div>

<div style="position: relative; border-radius: 12px; background: #FFF4E6; color: #2A0E3A; padding: 10px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="position: absolute; left: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2A0E3A"></span>
<span style="position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2A0E3A"></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #8A2560">GREETINGS · SHARE CARD</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 18px; line-height: 1.25">Saare diye jalte rahe. Tu bata?</p>
<div style="border-top: 2px dashed #E0C2D8; padding-top: 5px; font-size: 12px; font-weight: 600; color: #6A2C8C">[Game name] · Tyohar · Easy</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 26px; border: 0; background: #FF9F1C; color: #2A0E3A; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Share challenge
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #FF9F1C; background: transparent; color: #FF9F1C; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Keep playing</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) { return { ch: ch }; }) };
    };
    var segs = [];
    for (var n = 0; n < 15; n++) { segs.push({ n: n }); }
    return { segs: segs, lines: [{ words: [toWord('GANESH')] }, { words: [toWord('CHATURTHI')] }] };
  }
}
</script>
</body>
</html>
