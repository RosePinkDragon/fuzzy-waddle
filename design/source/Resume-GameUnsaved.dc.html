<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game screen: Resume-GameUnsaved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
/* Shared theme tokens: the values are the filmy colors in src/themes/themes.ts. Swap this block to re-theme. */
body{margin:0;background:#2A0710}
.t{--bg:#2A0710;--panel:#3A0B15;--border:#7A2633;--accent:#F2B33D;--text:#FFF4DC;--muted:#F7D9A0;--on-accent:#2A0710;--chip-bg:#F7D9A0;--chip-text:#5A1420;--badge-bg:#F28C28;--badge-text:#2A0710;--primary-bg:#F28C28;--primary-text:#2A0710;--scene-bg:#1A0409;--scene-border:3px dotted #F2B33D}
.root{width:390px;box-sizing:border-box;padding:14px 12px 20px;display:flex;flex-direction:column;gap:12px;background:var(--bg);color:var(--text);font-family:'Mukta',system-ui,sans-serif;overflow:hidden;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.h1{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.scene{position:relative;flex:1 1 0;box-sizing:border-box;border:var(--scene-border);border-radius:14px;overflow:hidden;background:var(--scene-bg)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--text);font-family:inherit;text-align:left;box-sizing:border-box}
.cards{display:flex;flex-direction:column;gap:10px;flex:none}
.opt{display:flex;flex-direction:column;gap:6px;padding:10px 14px;width:100%;min-height:44px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.dname{font-family:'Yatra One',serif;font-size:22px;line-height:1.2}
.small{font-size:13px;line-height:1.3;color:var(--muted)}
.best{font-size:11px;font-weight:700;line-height:1.3;color:var(--accent);text-align:right}
.go{width:32px;height:32px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.sign{display:flex;align-items:center;white-space:nowrap}
.left{margin-left:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--text)}
.btn{height:48px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;box-sizing:border-box}
.primary{background:var(--primary-bg);color:var(--primary-text);border:0}
.secondary{background:transparent;color:var(--text);border:1.5px solid var(--accent)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:2px 8px;border-radius:8px;background:var(--chip-bg);color:var(--chip-text);white-space:nowrap}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 6px 10px 12px;border:1.5px solid var(--accent);border-radius:14px;background:var(--panel);flex:none}
.ntitle{font-size:14px;font-weight:800;line-height:1.25;color:var(--text)}
.nbody{font-size:13px;line-height:1.3;color:var(--muted)}
.foot{margin-top:auto;font-size:12px;line-height:1.35;color:var(--muted);text-align:center;flex:none}
.sub{font-size:11px;font-weight:800;letter-spacing:.14em;line-height:1.3;color:var(--accent);flex:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 16px 20px;border-radius:20px 20px 0 0;background:var(--panel);border-top:1.5px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.sign-above{display:none}
.cmp-only{display:none!important}
@media (max-height:779px){
 .root{gap:8px;padding:10px 12px 12px}
 .cards{gap:8px}
 .opt{padding:8px 14px;gap:4px}
 .cmp-hide{display:none!important}
 .sign-in{display:none!important}
 .sign-above{display:flex}
 .cmp-only{display:inline-flex!important}
 .wide-only{display:none!important}
 .btn{height:46px}
 .notice{padding:8px 6px 8px 12px}
 .tiles{gap:6px!important}
 .clue{padding:8px 12px!important}
}
</style>
</helmet>
<div class="t root">

<div class="hdr">
<button type="button" class="round" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="display:flex;flex-direction:column;align-items:center">
<span class="{{eyebrowClass}}">FILMY</span>
<sc-if value="{{strip}}" hint-placeholder-val="{{false}}"><span class="cmp-only" style="align-items:center;gap:4px;margin-top:-1px;padding:0 8px;height:18px;border-radius:9px;border:1px dashed var(--accent);font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--accent)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:0"><path d="M7 18h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.2 9.6 4.2 4.2 0 0 0 7 18z"></path><path d="M3 3l18 18"></path></svg>NOT SAVED</span></sc-if>
<h1 class="h1">Medium · 14 hits</h1>
</div>
<div style="display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>50 Cr Club</span>
</div>
</div>

<div style="display:flex;align-items:center;gap:10px;height:20px;flex:none">
<div style="flex:1 1 0;display:flex;gap:3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="10">
<span style="{{s.style}}"></span>
</sc-for>
</div>
<span style="font-size:12px;font-weight:700;white-space:nowrap">6 more to <span style="color:var(--accent)">100 Cr Club</span></span>
</div>


<sc-if value="{{strip}}" hint-placeholder-val="{{false}}">
<div role="status" class="wide-only" style="display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--panel);flex:none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:0"><path d="M7 18h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.2 9.6 4.2 4.2 0 0 0 7 18z"></path><path d="M3 3l18 18"></path></svg>
<span style="font-size:13px;line-height:1.25"><b style="font-weight:800">{{strip.title}}</b> <span style="color:var(--muted)">{{strip.body}}</span></span>
</div>
</sc-if>

<div style="flex:1 1 0;min-height:110px;max-height:200px;display:flex;flex-direction:column;gap:6px">
<div class="sign-above" style="justify-content:center">
<span style="display:flex;align-items:center;gap:4px;padding:2px 10px;border-radius:8px;background:var(--bg);border:1.5px solid var(--accent);white-space:nowrap">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="9"><span style="{{m.style}}">{{m.ch}}</span></sc-for>
<span class="left">4 LEFT</span>
</span>
</div>
<div class="scene" style="min-height:90px">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="The hero dangles from a cliff edge while a crocodile waits in the water below">
<g transform="translate(0 24)">
<circle cx="322" cy="34" r="14" fill="#FFF4DC" opacity="0.9"></circle>
<circle cx="240" cy="24" r="1.5" fill="#FFF4DC" opacity="0.7"></circle>
<circle cx="282" cy="62" r="1.5" fill="#FFF4DC" opacity="0.7"></circle>
<circle cx="214" cy="40" r="1.5" fill="#FFF4DC" opacity="0.7"></circle>
<circle cx="348" cy="82" r="1.5" fill="#FFF4DC" opacity="0.7"></circle>
<rect x="160" y="150" width="206" height="26" fill="#0E3B4A"></rect>
<path d="M160 150 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2B6F85" stroke-width="3"></path>
<ellipse cx="296" cy="152" rx="30" ry="6" fill="#3E7B45"></ellipse>
<circle cx="310" cy="146" r="6" fill="#3E7B45"></circle>
<circle cx="322" cy="146" r="6" fill="#3E7B45"></circle>
<circle cx="310" cy="145" r="3" fill="#FFF4DC"></circle>
<circle cx="322" cy="145" r="3" fill="#FFF4DC"></circle>
<circle cx="309" cy="145" r="1.5" fill="#1A0409"></circle>
<circle cx="321" cy="145" r="1.5" fill="#1A0409"></circle>
<path d="M272 156 l3 3 l3 -3 l3 3 l3 -3 l3 3 l3 -3" fill="none" stroke="#FFF4DC" stroke-width="1.5" stroke-linejoin="round"></path>
<polygon points="0,48 182,48 174,80 188,112 166,150 172,176 0,176" fill="#5C2A1C"></polygon>
<path d="M0 48 H182" stroke="#8A4A2C" stroke-width="4"></path>
<path d="M40 80 l30 10 M96 120 l24 -8 M30 142 l20 6 M120 70 l18 4" stroke="#43200F" stroke-width="3" stroke-linecap="round"></path>
<path d="M162 42 l-4 -6 M170 40 l0 -7 M180 41 l4 -6" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"></path>
<path d="M186 84 Q 200 80 216 90 Q 207 93 201 97 Q 194 91 186 89 Z" fill="#E0343F"></path>
<g fill="none" stroke="#FFF4DC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M170 50 L184 84"></path>
<path d="M180 50 L196 84"></path>
<path d="M190 82 L190 118"></path>
<path d="M190 118 L180 140 L184 158"></path>
<path d="M190 118 L202 136 L212 150"></path>
</g>
<circle cx="170" cy="50" r="4" fill="#FFF4DC"></circle>
<circle cx="180" cy="50" r="4" fill="#FFF4DC"></circle>
<circle cx="190" cy="71" r="9" fill="#FFF4DC"></circle>
<circle cx="187" cy="70" r="1.3" fill="#1A0409"></circle>
<circle cx="193" cy="70" r="1.3" fill="#1A0409"></circle>
<path d="M186 77 q4 -3 8 0" fill="none" stroke="#1A0409" stroke-width="1.5" stroke-linecap="round"></path>
<path d="M205 60 q3 5 0 7 q-3 -2 0 -7 Z" fill="#8FD3FF"></path>
<path d="M176 62 q3 5 0 7 q-3 -2 0 -7 Z" fill="#8FD3FF"></path>
</g>
</svg>
<div class="sign-in" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:2px 10px;border-radius:8px;background:var(--bg);border:1.5px solid var(--accent);white-space:nowrap">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="9"><span style="{{m.style}}">{{m.ch}}</span></sc-for>
<span class="left">4 LEFT</span>
</div>
</div>
</div>

<div class="tiles" style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:none">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display:flex;gap:20px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="2">
<div style="display:flex;gap:6px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="4">
<sc-if value="{{t.shown}}" hint-placeholder-val="{{false}}">
<span style="width:38px;height:46px;border-radius:8px;background:var(--text);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:'Yatra One',serif;font-size:26px">{{t.ch}}</span>
</sc-if>
<sc-if value="{{t.hidden}}" hint-placeholder-val="{{true}}">
<span style="width:38px;height:46px;box-sizing:border-box;border-radius:8px;background:var(--panel);border-bottom:3px solid var(--accent)"></span>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div class="card clue" style="padding:10px 14px;display:flex;flex-direction:column;gap:6px;flex:none">
<div style="display:flex;align-items:center;gap:8px">
<span style="font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-right:auto">CLUES</span>
<span style="font-size:12px;font-weight:700;background:var(--chip-bg);color:var(--chip-text);border-radius:10px;padding:2px 10px">{{clue.chip}}</span>
</div>
<p style="margin:0;font-size:15px;line-height:1.35">{{clue.text}}</p>
</div>

<div style="margin-top: auto; flex: none; display: flex; gap: 8px">
<button type="button" aria-label="Director's Cut: reveal one letter, 2 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path><path d="M4 11l-.6-3.2a1 1 0 0 1 .8-1.2l13.8-2.5a1 1 0 0 1 1.2.8L19.6 8"></path><path d="M8.6 6.3l2 3.6M13.1 5.5l2 3.6"></path></svg>
<span>Director's Cut</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: var(--badge-bg); color: var(--on-accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
</button>
<button type="button" aria-label="Trailer: get an extra clue, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>
<span>Trailer</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: var(--badge-bg); color: var(--on-accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
<button type="button" aria-label="Flashback: undo a wrong guess, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
<span>Flashback</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: var(--badge-bg); color: var(--on-accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
<button type="button" aria-label="Censor Board: remove 3 letters not in the title, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4L8.12 15.88"></path><path d="M14.47 14.48L20 20"></path><path d="M8.12 8.12L12 12"></path></svg>
<span>Censor Board</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: var(--badge-bg); color: var(--on-accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
</div>

<div style="display:flex;flex-direction:column;gap:6px;flex:none">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display:flex;justify-content:center;gap:4px">
<sc-for list="{{row.keys}}" as="k" hint-placeholder-count="9">
<sc-if value="{{k.open}}" hint-placeholder-val="{{true}}">
<button type="button" style="width:32px;height:46px;border:0;border-radius:7px;background:var(--text);color:var(--on-accent);font-family:inherit;font-size:18px;font-weight:800;padding:0">{{k.l}}</button>
</sc-if>
<sc-if value="{{k.right}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" aria-label="{{k.l}}, in the title" style="width:32px;height:46px;border:0;border-radius:7px;background:var(--accent);color:var(--on-accent);font-family:inherit;font-size:18px;font-weight:800;padding:0">{{k.l}}</button>
</sc-if>
<sc-if value="{{k.wrong}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" aria-label="{{k.l}}, not in the title" style="width:32px;height:46px;border:0;border-radius:7px;background:#3A1018;color:#B98C92;font-family:inherit;font-size:18px;font-weight:800;padding:0;text-decoration:line-through;text-decoration-thickness:2px">{{k.l}}</button>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>

<sc-if value="{{banner}}" hint-placeholder-val="{{false}}">
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
<span style="display:flex;align-items:center;gap:10px"><span id="sheet-title" style="font-family:'Yatra One',serif;font-size:24px;line-height:1.2">{{banner.title}}</span></span>
<div style="display:flex;flex-direction:column;gap:6px">
<sc-for list="{{banner.lines}}" as="ln" hint-placeholder-count="2">
<span style="display:flex;gap:8px;font-size:15px;line-height:1.35"><span style="color:var(--accent);font-weight:800">•</span><span>{{ln}}</span></span>
</sc-for>
</div>
<sc-if value="{{banner.refund}}" hint-placeholder-val="{{true}}"><span class="tag" style="align-self:flex-start;font-size:12px;padding:4px 10px">{{banner.refund}}</span></sc-if>
<button type="button" class="btn primary" style="height:52px;margin-top:4px">{{banner.cta}}</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
