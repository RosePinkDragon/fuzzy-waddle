<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>

<style>
/* Storyboard sheet for #109 (motion). Frames are 84x182 minis of the real screens, drawn from the theme tokens in src/themes/themes.ts.
   The sheet itself is a neutral design board, not an app screen. Labels sit outside the frames; nothing is written inside a frame. */
body{margin:0;background:#121014}
.root{width:390px;box-sizing:border-box;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;background:#121014;color:#F4EFE6;font-family:'Mukta',system-ui,sans-serif;overflow:hidden}
.ttl{font-family:'Yatra One',serif;font-size:21px;line-height:1.15;color:#F2B33D}
.sub{font-size:12.5px;line-height:1.3;color:#D6CEC2}
.row{display:flex;flex-direction:column;gap:4px;flex:none}
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rn{font-size:13.5px;font-weight:800;line-height:1.2}
.rm{font-size:11px;font-weight:700;line-height:1.2;color:#F2B33D;text-align:right}
.frames{display:flex;justify-content:space-between}
.fc{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini{width:78px;height:169px}.mini-lg{width:116px;height:251px}
.ft{font-size:11px;font-weight:700;line-height:1.2;color:#D6CEC2}
.rnote{font-size:11.5px;line-height:1.3;color:#D6CEC2}
.notes{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid #3A3430;border-radius:10px;flex:none}
.note{font-size:11.5px;line-height:1.3;color:#D6CEC2}
@media (max-height:779px){.mini{width:74px;height:160px}.tall-only{display:none!important}.root{gap:6px;padding:8px 12px 8px}.rnote{display:none}}
</style>
</helmet>
<div class="root">

<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div class="row">
<sc-if value="{{r.name}}" hint-placeholder-val="{{true}}"><div class="rh"><span class="rn">{{r.name}}</span><span class="rm">{{r.meta}}</span></div></sc-if>
<div class="frames">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="4">
<div class="fc">
<div class="{{f.cls}}" style="{{f.box}}" role="img" aria-label="{{f.t}}">
<sc-for list="{{f.layers}}" as="l" hint-placeholder-count="2"><div style="{{l.s}}"><sc-for list="{{l.kids}}" as="k" hint-placeholder-count="8"><div style="{{k.s}}"><sc-if value="{{k.ic}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{k.ics}}"><sc-if value="{{k.filmy}}" hint-placeholder-val="{{false}}"><rect x="3" y="9.5" width="18" height="11" rx="1.5"></rect><path d="M3.2 9.2L19.8 4.6l.8 3L4 12.2z"></path><path d="M8.3 7.8l2.4 2.9M13.4 6.4l2.4 2.9"></path></sc-if><sc-if value="{{k.khana}}" hint-placeholder-val="{{false}}"><path d="M3 12h18a9 7.5 0 0 1-18 0z"></path><path d="M8 3.5c-1.2 1.5 1.2 2.5 0 4.5M12 2.5c-1.2 1.5 1.2 2.5 0 4.5M16 3.5c-1.2 1.5 1.2 2.5 0 4.5"></path></sc-if><sc-if value="{{k.safar}}" hint-placeholder-val="{{false}}"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 10h14"></path><circle cx="9" cy="13.5" r="1"></circle><circle cx="15" cy="13.5" r="1"></circle><path d="M8 17l-2 4M16 17l2 4"></path></sc-if><sc-if value="{{k.cricket}}" hint-placeholder-val="{{false}}"><path d="M15 3l3 3-9 9-3-3z"></path><path d="M6 12l-3 3 3 3 3-3"></path><circle cx="18" cy="18" r="2.6"></circle></sc-if><sc-if value="{{k.tyohar}}" hint-placeholder-val="{{false}}"><path d="M3 14c2.5 5.5 15.5 5.5 18 0z"></path><path d="M12 3.5c2.2 3 2.6 5.2 0 7.8-2.6-2.6-2.2-4.8 0-7.8z"></path></sc-if><sc-if value="{{k.masala}}" hint-placeholder-val="{{false}}"><path d="M17 3.5c-.8.3-1.4 1.1-1.4 2"></path><path d="M15.6 5.5c3.3.6 3.8 5 .6 8.4-3 3.2-7.6 5.3-12.2 5.6 3.6-2.2 5.5-5.2 6.5-8.2 1-3 2.9-5.6 5.1-5.8z"></path></sc-if></svg></sc-if></div></sc-for></div></sc-for>
</div>
<span class="ft">{{f.t}}</span>
</div>
</sc-for>
</div>
<sc-if value="{{r.note}}" hint-placeholder-val="{{true}}"><span class="rnote">{{r.note}}</span></sc-if>
</div>
</sc-for>
<sc-if value="{{notes.length}}" hint-placeholder-val="{{true}}"><div class="notes tall-only"><sc-for list="{{notes}}" as="n" hint-placeholder-count="2"><span class="note">• {{n}}</span></sc-for></div></sc-if>
</div>
</x-dc>

     rows:[
