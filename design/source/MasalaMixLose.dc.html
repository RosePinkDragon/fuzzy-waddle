<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masala Mix run over screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#1E1A17}
a{color:#F2B705}a:hover{color:#FFD54A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 12px; background: #1E1A17; color: #FFF4DC; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #F2B705">MASALA MIX</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Hard · Run over</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F2B705; color: #1E1A17; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 140px; max-height: 220px; border-radius: 14px; overflow: hidden; background: #2C2621">
<svg width="100%" height="100%" viewBox="0 0 366 220" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="A burning red chilli, a face red from the spice, and a glass of cold water">
<path d="M54 58 Q130 18 226 38 Q262 46 274 34 Q268 60 226 64 Q136 74 54 58 Z" fill="#E2402F"></path>
<path d="M274 34 q10 -12 24 -10" fill="none" stroke="#3E7B45" stroke-width="6" stroke-linecap="round"></path>
<path d="M90 50 Q150 34 210 42" fill="none" stroke="#FF8A7A" stroke-width="3" stroke-linecap="round" opacity="0.6"></path>
<path d="M34 72 q-8 -14 2 -26 q0 10 8 12 q-2 -12 8 -22 q2 14 10 18 q4 -6 2 -12 q12 8 6 30 z" fill="#F28C28"></path>
<path d="M40 70 q-4 -8 2 -14 q2 6 6 8 q0 -6 4 -10 q4 10 2 16 z" fill="#F2B705"></path>
<circle cx="84" cy="184" r="24" fill="#E2402F"></circle>
<path d="M73 176 l6 6 M79 176 l-6 6 M89 176 l6 6 M95 176 l-6 6" stroke="#1E1A17" stroke-width="2.5" stroke-linecap="round"></path>
<ellipse cx="84" cy="196" rx="8" ry="6" fill="#1E1A17"></ellipse>
<path d="M58 170 l-10 -8 M110 170 l10 -8 M60 178 l-12 -2 M108 178 l12 -2" stroke="#EAD9C0" stroke-width="3" stroke-linecap="round" opacity="0.8"></path>
<path d="M104 160 q3 5 0 7 q-3 -2 0 -7 Z" fill="#8FD3FF"></path>
<path d="M284 150 h44 l-6 62 h-32 z" fill="#8FD3FF" fill-opacity="0.35" stroke="#CFE0FF" stroke-width="3" stroke-linejoin="round"></path>
<path d="M288 170 h36" stroke="#CFE0FF" stroke-width="2"></path>
<rect x="294" y="176" width="10" height="10" rx="2" fill="#F4F1E8" opacity="0.7"></rect>
<rect x="308" y="182" width="10" height="10" rx="2" fill="#F4F1E8" opacity="0.7"></rect>
</svg>
<p style="position: absolute; top: 42%; left: 50%; margin: 0; transform: translate(-50%, -50%) rotate(6deg); white-space: nowrap; font-family: 'Yatra One', serif; font-size: 28px; line-height: 1.1; color: #FF5A64; background: #1E1A17; border: 4px double #FF5A64; border-radius: 8px; padding: 4px 14px">Mirchi Lag Gayi!</p>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 8px">
<div style="display: flex; gap: 2px">
<sc-for list="{{livesA}}" as="l" hint-placeholder-count="4">
<span style="font-family: 'Yatra One', serif; font-size: 17px; line-height: 1.4; color: #4A3F35">{{l.ch}}</span>
</sc-for>
</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{livesB}}" as="l" hint-placeholder-count="5">
<span style="font-family: 'Yatra One', serif; font-size: 17px; line-height: 1.4; color: #A89482; text-decoration: line-through; text-decoration-color: #E2402F; text-decoration-thickness: 2px">{{l.ch}}</span>
</sc-for>
</div>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.06em">0 LEFT</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
<h1 style="margin: 0; font-family: 'Yatra One', serif; font-weight: 400; font-size: 26px; line-height: 1.2">Thanda paani piyo, phir aao.</h1>
<p style="margin: 0; font-size: 14px; color: #EAD9C0">The answer was <span style="font-weight: 800; color: #FFF4DC">Mumbai Local</span> (Safar).</p>
</div>

<div style="display: flex; gap: 8px">
<div style="flex: 1 1 0; border-radius: 12px; background: #2C2621; border: 1px solid #4A3F35; padding: 8px 12px; display: flex; flex-direction: column">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #F2B705">THIS RUN</span>
<span style="font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.25">31 hits</span>
<span style="font-size: 12px; color: #EAD9C0">100 Crore Club</span>
</div>
<div style="flex: 1 1 0; border-radius: 12px; background: #2C2621; border: 1px solid #4A3F35; padding: 8px 12px; display: flex; flex-direction: column">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #F2B705">YOUR BEST · HARD</span>
<span style="font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.25">38 hits</span>
<span style="font-size: 12px; color: #EAD9C0">200 Crore Club</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 700">200 Crore Club bas <span style="color: #F2B705">4 hits</span> door tha</span>
<div style="display: flex; gap: 3px">
<sc-for list="{{near}}" as="s" hint-placeholder-count="15">
<sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
<span style="flex: 1 1 0; height: 8px; border-radius: 4px; background: #F2B705"></span>
</sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{false}}">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #4A3F35; background: #2C2621"></span>
</sc-if>
</sc-for>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 56px; border-radius: 28px; border: 0; background: #F2B705; color: #1E1A17; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; cursor: pointer">
<span style="font-size: 16px; font-weight: 800">Ek aur plate</span>
<span style="font-size: 12px; font-weight: 700">New random run</span>
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #F2B705; background: transparent; color: #F2B705; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Challenge a friend with this one
</button>
<button type="button" style="height: 44px; border: 0; background: transparent; color: #FFF4DC; font-family: inherit; font-size: 14px; font-weight: 700; text-decoration: underline; cursor: pointer">Change difficulty</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toItem = function (ch) { return { ch: ch }; };
    return {
      livesA: 'DESI'.split('').map(toItem),
      livesB: 'MASTI'.split('').map(toItem),
      near: Array.from({ length: 15 }, function (_, i) { return { on: i < 11, off: i >= 11 }; })
    };
  }
}
</script>
</body>
</html>
