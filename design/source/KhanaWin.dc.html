<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khana milestone win screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#2B1606}
a{color:#F2B705}a:hover{color:#FFD54A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: #2B1606; color: #FFF4DC; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6B3A16; background: #3D200B; color: #FFF4DC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #F2B705">KHANA</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Easy · 20 hits</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F2B705; color: #2B1606; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 80px; max-height: 200px; border-radius: 14px; overflow: hidden; background: #2E1A0C; border: 1px solid #6B3A16">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="A full thali on the table, steaming hot">
<path d="M30 0V140M60 0V140M90 0V140M120 0V140M150 0V140M180 0V140M210 0V140M240 0V140M270 0V140M300 0V140M330 0V140M0 30H366M0 60H366M0 90H366M0 120H366" stroke="#3D2512" stroke-width="2"></path>
<rect x="0" y="140" width="366" height="60" fill="#4A2A12"></rect>
<path d="M0 140 H366" stroke="#6B3A16" stroke-width="4"></path>
<g fill="none" stroke="#FFF4DC" stroke-width="3" stroke-linecap="round" opacity="0.5">
<path d="M146 94 q-8 -12 0 -24 q8 -12 0 -24"></path>
<path d="M183 88 q-8 -12 0 -24 q8 -12 0 -24"></path>
<path d="M220 94 q-8 -12 0 -24 q8 -12 0 -24"></path>
</g>
<ellipse cx="183" cy="130" rx="112" ry="26" fill="#A8A8A0"></ellipse>
<ellipse cx="183" cy="126" rx="104" ry="22" fill="#DADAD3"></ellipse>
<ellipse cx="124" cy="118" rx="20" ry="8" fill="#9C9C94"></ellipse>
<ellipse cx="124" cy="116" rx="16" ry="5" fill="#F2B705"></ellipse>
<ellipse cx="166" cy="112" rx="20" ry="8" fill="#9C9C94"></ellipse>
<ellipse cx="166" cy="110" rx="16" ry="5" fill="#E2402F"></ellipse>
<ellipse cx="208" cy="112" rx="20" ry="8" fill="#9C9C94"></ellipse>
<ellipse cx="208" cy="110" rx="16" ry="5" fill="#7FBF5E"></ellipse>
<ellipse cx="248" cy="118" rx="20" ry="8" fill="#9C9C94"></ellipse>
<ellipse cx="248" cy="116" rx="16" ry="5" fill="#FFF4DC"></ellipse>
<ellipse cx="156" cy="134" rx="26" ry="8" fill="#FFF4DC"></ellipse>
<ellipse cx="214" cy="135" rx="26" ry="8" fill="#C98A3E"></ellipse>
<ellipse cx="220" cy="132" rx="24" ry="7" fill="#E8B96E"></ellipse>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B705" transform="translate(70 44)"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B705" transform="translate(296 36) scale(0.8)"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B705" transform="translate(318 96) scale(0.6)"></path>
</svg>
<h1 style="position: absolute; bottom: 8px; left: 50%; margin: 0; transform: translateX(-50%) rotate(-6deg); white-space: nowrap; font-family: 'Yatra One', serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #F2B705; background: #2B1606; border: 4px double #F2B705; border-radius: 8px; padding: 2px 14px">Swaad Aa Gaya!</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; gap: 18px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="1">
<div style="display: flex; gap: 5px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="5">
<span style="width: 34px; height: 42px; border-radius: 8px; background: #FFF4DC; color: #2B1606; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 22px">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 13px; color: #F6DFA8">Punjab · Main course</span>
</div>

<div style="border-radius: 14px; background: #3D200B; border: 1px solid #6B3A16; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #F2B705">BOSS ROUND CLEARED</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.2">100 Crore Club mein entry!</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; background: #F9E2A6; color: #5A2A08; border-radius: 10px; padding: 2px 10px">Lives refilled: 9 of 9</span>
<span style="font-size: 12px; font-weight: 700; background: #F9E2A6; color: #5A2A08; border-radius: 10px; padding: 2px 10px">+1 Chakh Lo</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
<span>Next: <span style="color: #F2B705">200 Crore Club</span></span>
<span>15 hits to go</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="15">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #6B3A16; background: #3D200B"></span>
</sc-for>
</div>
</div>

<div style="position: relative; border-radius: 12px; background: #FFF4DC; color: #2B1606; padding: 10px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="position: absolute; left: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2B1606"></span>
<span style="position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2B1606"></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #9A2A14">BILL · SHARE CARD</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 18px; line-height: 1.25">Ek bhi dish nahi jali. Tera kya scene?</p>
<div style="border-top: 2px dashed #D9B98A; padding-top: 5px; font-size: 12px; font-weight: 600; color: #6B3A16">[Game name] · Khana · Easy</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 26px; border: 0; background: #F2B705; color: #2B1606; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Challenge on WhatsApp
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #F2B705; background: transparent; color: #F2B705; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Keep playing</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) { return { ch: ch }; }) };
    };
    var segs = [];
    for (var n = 0; n < 15; n++) { segs.push({ n: n }); }
    return { segs: segs, lines: [{ words: [toWord('DAL')] }, { words: [toWord('MAKHANI')] }] };
  }
}
</script>
</body>
</html>
