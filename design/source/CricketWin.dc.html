<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cricket milestone win screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#0B2A1A}
a{color:#E9F07A}a:hover{color:#F5F9B0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: #0B2A1A; color: #F4F1E8; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #1F6B45; background: #12402A; color: #F4F1E8; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #E9F07A">CRICKET</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Easy · 20 hits</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #E9F07A; color: #0B2A1A; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 80px; max-height: 200px; border-radius: 14px; overflow: hidden; background: #0A1F2E; border: 1px solid #1F6B45">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="The batter hits the ball out of the stadium as fireworks go off">
<polygon points="20,40 46,40 120,200 -40,200" fill="#F4F1E8" opacity="0.07"></polygon>
<polygon points="320,40 346,40 406,200 246,200" fill="#F4F1E8" opacity="0.07"></polygon>
<rect x="0" y="62" width="366" height="36" fill="#14283A"></rect>
<g opacity="0.85" transform="translate(0 -12)">
<circle cx="14" cy="84" r="3" fill="#E9F07A"></circle><circle cx="34" cy="96" r="3" fill="#3FA7D6"></circle><circle cx="58" cy="82" r="3" fill="#F28C28"></circle><circle cx="78" cy="98" r="3" fill="#F4F1E8"></circle><circle cx="100" cy="86" r="3" fill="#3FA7D6"></circle><circle cx="122" cy="100" r="3" fill="#E0343F"></circle><circle cx="146" cy="84" r="3" fill="#E9F07A"></circle><circle cx="168" cy="96" r="3" fill="#3FA7D6"></circle><circle cx="190" cy="82" r="3" fill="#F28C28"></circle><circle cx="212" cy="98" r="3" fill="#F4F1E8"></circle><circle cx="236" cy="86" r="3" fill="#3FA7D6"></circle><circle cx="258" cy="100" r="3" fill="#E9F07A"></circle><circle cx="282" cy="84" r="3" fill="#E0343F"></circle><circle cx="304" cy="96" r="3" fill="#3FA7D6"></circle><circle cx="328" cy="82" r="3" fill="#F28C28"></circle><circle cx="350" cy="98" r="3" fill="#F4F1E8"></circle>
</g>
<path d="M33 40 V98 M333 40 V98" stroke="#9AA8BF" stroke-width="4"></path>
<rect x="20" y="24" width="26" height="16" rx="2" fill="#F4F1E8"></rect>
<rect x="320" y="24" width="26" height="16" rx="2" fill="#F4F1E8"></rect>
<rect x="0" y="98" width="366" height="102" fill="#1E7A3A"></rect>
<path d="M150 104 L196 104 L216 200 L130 200 Z" fill="#C8A96B"></path>
<g stroke-width="2.5" stroke-linecap="round">
<path d="M84 18v-8M84 42v8M72 30h-8M96 30h8M75.5 21.5l-5.5-5.5M92.5 21.5l5.5-5.5M75.5 38.5l-5.5 5.5M92.5 38.5l5.5 5.5" stroke="#F28C28"></path>
<path d="M250 12v-6M250 32v6M240 22h-6M260 22h6M243 15l-4-4M257 15l4-4M243 29l-4 4M257 29l4 4" stroke="#E9F07A"></path>
</g>
<path d="M196 96 Q264 0 338 22" fill="none" stroke="#E9F07A" stroke-width="2" stroke-dasharray="5 6"></path>
<circle cx="340" cy="23" r="5" fill="#E0343F"></circle>
<g fill="none" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M172 108 L172 132"></path>
<path d="M172 132 L162 146 L158 156"></path>
<path d="M172 132 L184 146 L190 156"></path>
<path d="M172 114 L188 104"></path>
</g>
<rect x="186" y="76" width="7" height="30" rx="2" fill="#D9A55B" transform="rotate(30 189 104)"></rect>
<circle cx="172" cy="100" r="7" fill="#F4F1E8"></circle>
<path d="M164 99 q8 -12 16 0 z" fill="#2E5AAC"></path>
</svg>
<h1 style="position: absolute; bottom: 8px; left: 50%; margin: 0; transform: translateX(-50%) rotate(-6deg); white-space: nowrap; font-family: 'Yatra One', serif; font-weight: 400; font-size: 32px; line-height: 1.1; color: #E9F07A; background: #0B2A1A; border: 4px double #E9F07A; border-radius: 8px; padding: 2px 16px">Chhakka!</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="1">
<div style="display: flex; gap: 18px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="2">
<div style="display: flex; gap: 5px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="4">
<span style="width: 34px; height: 42px; border-radius: 8px; background: #F4F1E8; color: #0B2A1A; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 22px">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 13px; color: #CDEBD5">Bowling · Three in a row</span>
</div>

<div style="border-radius: 14px; background: #12402A; border: 1px solid #1F6B45; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #E9F07A">BOSS ROUND CLEARED</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.2">100 Crore Club mein entry!</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; background: #DDEFC9; color: #1E4A28; border-radius: 10px; padding: 2px 10px">Lives refilled: 9 of 9</span>
<span style="font-size: 12px; font-weight: 700; background: #DDEFC9; color: #1E4A28; border-radius: 10px; padding: 2px 10px">+1 Free Hit</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
<span>Next: <span style="color: #E9F07A">200 Crore Club</span></span>
<span>15 hits to go</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="15">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #1F6B45; background: #12402A"></span>
</sc-for>
</div>
</div>

<div style="position: relative; border-radius: 12px; background: #F4F1E8; color: #0B2A1A; padding: 10px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="position: absolute; left: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #0B2A1A"></span>
<span style="position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #0B2A1A"></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #1F5A2E">MATCH PASS · SHARE CARD</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 18px; line-height: 1.25">Match jeeta, wo bhi last ball pe. Tu?</p>
<div style="border-top: 2px dashed #B9D3A8; padding-top: 5px; font-size: 12px; font-weight: 600; color: #1F6B45">[Game name] · Cricket · Easy</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 26px; border: 0; background: #E9F07A; color: #0B2A1A; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Challenge on WhatsApp
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #E9F07A; background: transparent; color: #E9F07A; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Keep playing</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) { return { ch: ch }; }) };
    };
    var segs = [];
    for (var n = 0; n < 15; n++) { segs.push({ n: n }); }
    return { segs: segs, lines: [{ words: [toWord('HAT'), toWord('TRICK')] }] };
  }
}
</script>
</body>
</html>
