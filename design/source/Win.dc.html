<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Milestone win screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#2A0710}
a{color:#F2B33D}a:hover{color:#FFD27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; background: #2A0710; color: #FFF4DC; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #7A2633; background: #3A0B15; color: #FFF4DC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #F2B33D">FILMY</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Easy · 20 hits</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F2B33D; color: #2A0710; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="position: relative; flex: 1 1 0; min-height: 80px; max-height: 200px; border-radius: 14px; overflow: hidden; background: #2A0710; border: 1px solid #5A1420">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="The hero does a slow-motion walk while a wind machine blows his scarf">
<g fill="#3A0B15">
<path d="M183 220 L163 -140 L203 -140 Z" transform="rotate(-72 183 220)"></path>
<path d="M183 220 L163 -140 L203 -140 Z" transform="rotate(-36 183 220)"></path>
<path d="M183 220 L163 -140 L203 -140 Z"></path>
<path d="M183 220 L163 -140 L203 -140 Z" transform="rotate(36 183 220)"></path>
<path d="M183 220 L163 -140 L203 -140 Z" transform="rotate(72 183 220)"></path>
</g>
<path d="M0 140 H366" stroke="#7A2633" stroke-width="2"></path>
<ellipse cx="194" cy="140" rx="30" ry="4" fill="#1A0409" opacity="0.7"></ellipse>
<path d="M54 118 V140" stroke="#B07F86" stroke-width="5" stroke-linecap="round"></path>
<path d="M38 140 H70" stroke="#B07F86" stroke-width="5" stroke-linecap="round"></path>
<circle cx="54" cy="92" r="26" fill="#3A0B15" stroke="#B07F86" stroke-width="3"></circle>
<ellipse cx="54" cy="80" rx="6" ry="12" fill="#F2B33D"></ellipse>
<ellipse cx="54" cy="80" rx="6" ry="12" fill="#F2B33D" transform="rotate(120 54 92)"></ellipse>
<ellipse cx="54" cy="80" rx="6" ry="12" fill="#F2B33D" transform="rotate(240 54 92)"></ellipse>
<circle cx="54" cy="92" r="4" fill="#FFF4DC"></circle>
<g stroke="#F2B33D" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.75">
<path d="M92 76 h44"></path>
<path d="M98 92 h56"></path>
<path d="M92 108 h40"></path>
</g>
<path d="M192 56 Q 214 48 236 58 Q 250 52 262 62 Q 246 66 236 66 Q 214 62 196 62 Z" fill="#E0343F"></path>
<g fill="none" stroke="#FFF4DC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M196 52 L196 96"></path>
<path d="M196 64 L212 80 L222 90"></path>
<path d="M196 64 L182 80 L176 94"></path>
<path d="M196 96 L208 118 L214 138"></path>
<path d="M196 96 L186 118 L176 136 L170 138"></path>
</g>
<circle cx="196" cy="40" r="12" fill="#FFF4DC"></circle>
<path d="M184 36 q2 -12 14 -12 q14 0 22 6 q-8 -1 -12 2 q4 2 6 6 q-8 -4 -14 -3 q-8 1 -16 1 z" fill="#1A0409"></path>
<rect x="185" y="36" width="9" height="5" rx="2" fill="#1A0409"></rect>
<rect x="197" y="36" width="9" height="5" rx="2" fill="#1A0409"></rect>
<path d="M194 38 H197" stroke="#1A0409" stroke-width="1.5"></path>
<path d="M190 46 q6 4 12 0" fill="none" stroke="#1A0409" stroke-width="1.6" stroke-linecap="round"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B33D" transform="translate(300 34)"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B33D" transform="translate(334 84) scale(0.7)"></path>
<path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#F2B33D" transform="translate(130 30) scale(0.8)"></path>
</svg>
<h1 style="position: absolute; bottom: 8px; left: 50%; margin: 0; transform: translateX(-50%) rotate(-7deg); white-space: nowrap; font-family: 'Yatra One', serif; font-weight: 400; font-size: 34px; line-height: 1.1; color: #F28C28; background: #2A0710; border: 4px double #F28C28; border-radius: 8px; padding: 2px 16px">Blockbuster!</h1>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; gap: 18px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="2">
<div style="display: flex; gap: 5px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="4">
<span style="width: 34px; height: 42px; border-radius: 8px; background: #FFF4DC; color: #2A0710; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 22px">{{t.ch}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
<span style="font-size: 13px; color: #F7D9A0">1998 · Romance</span>
</div>

<div style="border-radius: 14px; background: #3A0B15; border: 1px solid #7A2633; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #F2B33D">BOSS ROUND CLEARED</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 22px; line-height: 1.2">100 Crore Club mein entry!</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 700; background: #F7D9A0; color: #5A1420; border-radius: 10px; padding: 2px 10px">Lives refilled: 9 of 9</span>
<span style="font-size: 12px; font-weight: 700; background: #F7D9A0; color: #5A1420; border-radius: 10px; padding: 2px 10px">+1 Director's Cut</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700">
<span>Next: <span style="color: #F2B33D">200 Crore Club</span></span>
<span>15 hits to go</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="15">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #7A2633; background: #3A0B15"></span>
</sc-for>
</div>
</div>

<div style="position: relative; border-radius: 12px; background: #FFF4DC; color: #2A0710; padding: 10px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="position: absolute; left: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2A0710"></span>
<span style="position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #2A0710"></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #8A1C2B">ADMIT ONE · SHARE CARD</span>
<p style="margin: 0; font-family: 'Yatra One', serif; font-size: 18px; line-height: 1.25">100 Crore Club pahunch gaya. Tu kitne pe atka?</p>
<div style="border-top: 2px dashed #D9B98A; padding-top: 5px; font-size: 12px; font-weight: 600; color: #6B2A33">[Game name] · Filmy · Easy</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 26px; border: 0; background: #F28C28; color: #2A0710; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
Share challenge
</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1.5px solid #F2B33D; background: transparent; color: #F2B33D; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Keep playing</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) { return { ch: ch }; }) };
    };
    var segs = [];
    for (var n = 0; n < 15; n++) { segs.push({ n: n }); }
    return {
      segs: segs,
      lines: [
        { words: [toWord('KUCH'), toWord('KUCH')] },
        { words: [toWord('HOTA'), toWord('HAI')] }
      ]
    };
  }
}
</script>
</body>
</html>
