<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masala Mix game screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&amp;family=Yatra+One&amp;display=swap">
<style>
body{margin:0;background:#1E1A17}
a{color:#F2B705}a:hover{color:#FFD54A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 12px; background: #1E1A17; color: #FFF4DC; font-family: 'Mukta', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #F2B705">MASALA MIX</span>
<h1 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2">Hard · 31 hits</h1>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #F2B705; color: #1E1A17; font-weight: 800; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2.5"></path></svg>
<span>100 Cr Club</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; height: 20px">
<div style="flex: 1 1 0; display: flex; gap: 3px">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="15">
<sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
<span style="flex: 1 1 0; height: 8px; border-radius: 4px; background: #F2B705"></span>
</sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{false}}">
<span style="flex: 1 1 0; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #4A3F35; background: #2C2621"></span>
</sc-if>
</sc-for>
</div>
<span style="font-size: 12px; font-weight: 700; white-space: nowrap">4 more to <span style="color: #F2B705">200 Cr Club</span></span>
</div>

<div style="flex: 1 1 0; min-height: 120px; max-height: 200px; display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; flex: 1 1 0; min-height: 120px; border-radius: 14px; overflow: hidden; background: #2C2621">
<svg width="100%" height="100%" viewBox="0 0 366 200" preserveAspectRatio="xMidYMax slice" style="display: block" role="img" aria-label="A masala dabba next to a slot reel that has landed on the Safar category">
<g transform="translate(0 14)">
<circle cx="96" cy="108" r="80" fill="#B8B8B0" stroke="#DADAD3" stroke-width="4"></circle>
<g fill="#9C9C94">
<circle cx="144" cy="108" r="22"></circle><circle cx="120" cy="150" r="22"></circle><circle cx="72" cy="150" r="22"></circle><circle cx="48" cy="108" r="22"></circle><circle cx="72" cy="66" r="22"></circle><circle cx="120" cy="66" r="22"></circle><circle cx="96" cy="108" r="22"></circle>
</g>
<circle cx="144" cy="108" r="18" fill="#F2B705"></circle>
<circle cx="120" cy="150" r="18" fill="#E2402F"></circle>
<circle cx="72" cy="150" r="18" fill="#8A5A2B"></circle>
<circle cx="48" cy="108" r="18" fill="#3A2A1E"></circle>
<circle cx="72" cy="66" r="18" fill="#7FBF5E"></circle>
<circle cx="120" cy="66" r="18" fill="#6B3A1E"></circle>
<circle cx="96" cy="108" r="18" fill="#F4F1E8"></circle>
<path d="M126 146 L176 190" stroke="#DADAD3" stroke-width="5" stroke-linecap="round"></path>
<ellipse cx="124" cy="143" rx="9" ry="6" fill="#DADAD3" transform="rotate(42 124 143)"></ellipse>
<rect x="196" y="54" width="156" height="100" rx="12" fill="#1E1A17" stroke="#F2B705" stroke-width="2"></rect>
<path d="M262 64 H286 Q286 76 274 76 Q262 76 262 64 Z" fill="#6E6258"></path>
<rect x="204" y="86" width="140" height="34" rx="8" fill="#0F1E3D"></rect>
<rect x="258" y="94" width="32" height="16" rx="3" fill="#2E5AAC"></rect>
<rect x="262" y="98" width="6" height="5" rx="1" fill="#F4F1E8"></rect>
<rect x="271" y="98" width="6" height="5" rx="1" fill="#F4F1E8"></rect>
<rect x="280" y="98" width="6" height="5" rx="1" fill="#F4F1E8"></rect>
<circle cx="265" cy="113" r="2.5" fill="#F5A524"></circle>
<circle cx="283" cy="113" r="2.5" fill="#F5A524"></circle>
<circle cx="274" cy="137" r="8" fill="#6E6258"></circle>
<path d="M268 132 Q273 137 268 142 M280 132 Q275 137 280 142" stroke="#1E1A17" stroke-width="1.5" fill="none"></path>
<path d="M196 96 l8 7 l-8 7 Z" fill="#F2B705"></path>
<path d="M352 96 l-8 7 l8 7 Z" fill="#F2B705"></path>
</g>
</svg>
<div style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 2px 10px; border-radius: 8px; background: #1E1A17; border: 1.5px solid #F2B705; white-space: nowrap">
<div style="display: flex; gap: 2px">
<sc-for list="{{livesA}}" as="l" hint-placeholder-count="4">
<sc-if value="{{l.locked}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #4A3F35">{{l.ch}}</span>
</sc-if>
<sc-if value="{{l.struck}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #A89482; text-decoration: line-through; text-decoration-color: #E2402F; text-decoration-thickness: 2px">{{l.ch}}</span>
</sc-if>
<sc-if value="{{l.live}}" hint-placeholder-val="{{true}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #F2B705">{{l.ch}}</span>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 2px">
<sc-for list="{{livesB}}" as="l" hint-placeholder-count="5">
<sc-if value="{{l.locked}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #4A3F35">{{l.ch}}</span>
</sc-if>
<sc-if value="{{l.struck}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #A89482; text-decoration: line-through; text-decoration-color: #E2402F; text-decoration-thickness: 2px">{{l.ch}}</span>
</sc-if>
<sc-if value="{{l.live}}" hint-placeholder-val="{{true}}">
<span style="font-family: 'Yatra One', serif; font-size: 15px; line-height: 1.5; color: #F2B705">{{l.ch}}</span>
</sc-if>
</sc-for>
</div>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.06em">4 LEFT</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="2">
<div style="display: flex; gap: 20px">
<sc-for list="{{line.words}}" as="w" hint-placeholder-count="1">
<div style="display: flex; gap: 6px">
<sc-for list="{{w.tiles}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.shown}}" hint-placeholder-val="{{false}}">
<span style="width: 38px; height: 48px; border-radius: 8px; background: #FFF4DC; color: #1E1A17; display: flex; align-items: center; justify-content: center; font-family: 'Yatra One', serif; font-size: 26px">{{t.ch}}</span>
</sc-if>
<sc-if value="{{t.hidden}}" hint-placeholder-val="{{true}}">
<span style="width: 38px; height: 48px; box-sizing: border-box; border-radius: 8px; background: #2C2621; border-bottom: 3px solid #F2B705"></span>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="background: #2C2621; border: 1px solid #4A3F35; color: #FFF4DC; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #F2B705; margin-right: auto">CLUES</span>
<span style="font-size: 12px; font-weight: 800; background: #0F1E3D; color: #F5A524; border: 1px solid #F5A524; border-radius: 10px; padding: 2px 10px">Safar</span>
</div>
<div role="img" aria-label="Clue locked. Use Gyaan to unlock it." style="display: flex; align-items: center; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#958878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
<span style="width: 100%; height: 10px; border-radius: 5px; background: #4A3F35"></span>
<span style="width: 62%; height: 10px; border-radius: 5px; background: #4A3F35"></span>
</div>
</div>
</div>

<div style="margin-top: auto; display: flex; gap: 8px">
<button type="button" aria-label="Jugaad: reveal one letter, 2 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"></path></svg>
<span>Jugaad</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: #F2B705; color: #1E1A17; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
</button>
<button type="button" aria-label="Gyaan: get an extra clue, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h13v16H7a2 2 0 0 1-2-2z"></path><path d="M5 18a2 2 0 0 1 2-2h11"></path><path d="M9 8h6"></path></svg>
<span>Gyaan</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: #F2B705; color: #1E1A17; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
<button type="button" aria-label="U-Turn: undo a wrong guess, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V9a5 5 0 0 1 10 0v9"></path><path d="M14 15l3 3 3-3"></path></svg>
<span>U-Turn</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: #F2B705; color: #1E1A17; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
<button type="button" aria-label="Bhagao: remove 3 letters not in the answer, 1 left" style="position: relative; flex: 1 1 0; height: 54px; border-radius: 12px; border: 1px solid #4A3F35; background: #2C2621; color: #FFF4DC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2B705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M10 16l-4-4 4-4"></path><path d="M6 12h10"></path></svg>
<span>Bhagao</span>
<span style="position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; background: #F2B705; color: #1E1A17; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: flex; justify-content: center; gap: 4px">
<sc-for list="{{row.keys}}" as="k" hint-placeholder-count="9">
<sc-if value="{{k.open}}" hint-placeholder-val="{{true}}">
<button type="button" style="width: 32px; height: 46px; border: 0; border-radius: 7px; background: #FFF4DC; color: #1E1A17; font-family: inherit; font-size: 18px; font-weight: 800; padding: 0; cursor: pointer">{{k.l}}</button>
</sc-if>
<sc-if value="{{k.right}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" aria-label="{{k.l}}, in the answer" style="width: 32px; height: 46px; border: 0; border-radius: 7px; background: #F2B705; color: #1E1A17; font-family: inherit; font-size: 18px; font-weight: 800; padding: 0; cursor: pointer">{{k.l}}</button>
</sc-if>
<sc-if value="{{k.wrong}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" aria-label="{{k.l}}, not in the answer" style="width: 32px; height: 46px; border: 0; border-radius: 7px; background: #2A231E; color: #A89482; font-family: inherit; font-size: 18px; font-weight: 800; padding: 0; text-decoration: line-through; text-decoration-thickness: 2px">{{k.l}}</button>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var guessed = ['A', 'M'];
    var wrong = ['E'];
    var locked = 4;
    var used = locked + wrong.length;
    var state = function (ch, n) {
      return { ch: ch, locked: n < locked, struck: n >= locked && n < used, live: n >= used };
    };
    var livesA = 'DESI'.split('').map(function (ch, i) { return state(ch, i); });
    var livesB = 'MASTI'.split('').map(function (ch, i) { return state(ch, i + 4); });
    var toWord = function (s) {
      return { tiles: s.split('').map(function (ch) {
        var shown = guessed.indexOf(ch) > -1;
        return { ch: ch, shown: shown, hidden: !shown };
      }) };
    };
    var rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].map(function (r) {
      return { keys: r.split('').map(function (l) {
        var right = guessed.indexOf(l) > -1;
        var bad = wrong.indexOf(l) > -1;
        return { l: l, right: right, wrong: bad, open: !right && !bad };
      }) };
    });
    var segs = [];
    for (var n = 0; n < 15; n++) { segs.push({ on: n < 11, off: n >= 11 }); }
    return { livesA: livesA, livesB: livesB, segs: segs, lines: [{ words: [toWord('MUMBAI')] }, { words: [toWord('LOCAL')] }], rows: rows, yes: true };
  }
}
</script>
</body>
</html>
