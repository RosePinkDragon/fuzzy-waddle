name: PR rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-rules:
    name: PR rules
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      TITLE: ${{ github.event.pull_request.title }}
      BODY: ${{ github.event.pull_request.body }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch name is type/<issue>-short-name
        run: |
          pattern='^(feat|fix|chore|docs|test|refactor|ci|style|perf|build)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "::error::Branch '$BRANCH' must look like type/<issue>-short-name, for example feat/12-difficulty-picker"
            exit 1
          fi
          echo "OK: $BRANCH"

      - name: PR links the issue from the branch name
        run: |
          issue=$(sed -E 's#^[a-z]+/([0-9]+)-.*#\1#' <<<"$BRANCH")
          if ! grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #${issue}([^0-9]|$)" <<<"$BODY"; then
            echo "::error::The PR description must say 'Closes #${issue}' (the issue number in the branch name)"
            exit 1
          fi
          echo "OK: closes #${issue}"

      - name: Install commitlint
        run: npm install --global @commitlint/cli@20 @commitlint/config-conventional@20

      - name: PR title follows Conventional Commits
        run: printf '%s\n' "$TITLE" | commitlint --verbose

      - name: Every commit message follows Conventional Commits
        run: commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: PR changes 15 files or fewer
        run: |
          # Not counted: package-lock.json, design/ (images and mockups) and deleted files
          files=$(git diff --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" | grep -vx 'package-lock.json' | grep -v '^design/' || true)
          count=$(printf '%s' "$files" | grep -c . || true)
          printf '%s\n' "$files"
          if [ "$count" -gt 15 ]; then
            echo "::error::This PR changes $count files (max 15, not counting package-lock.json, design/ and deleted files). Split it into smaller PRs."
            exit 1
          fi
          echo "OK: $count files"
